<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Torneo Gamer - Geometry Rush</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0a12;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }
  #gameContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    font-size: 16px;
    text-shadow: 0 0 6px rgba(0,0,0,0.8);
    pointer-events: none;
    z-index: 10;
  }
  #levelBadge {
    padding: 4px 14px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
    transition: background 0.3s, color 0.3s;
  }
  #timeBar {
    position: absolute;
    top: 0; left: 0;
    height: 5px;
    background: linear-gradient(90deg, #00ffcc, #ff2e6c);
    width: 0%;
    z-index: 11;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(5,5,15,0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
    z-index: 20;
    gap: 16px;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: clamp(24px, 6vw, 42px);
    letter-spacing: 2px;
  }
  #overlay p { font-size: 14px; color: #aaa; max-width: 420px; line-height: 1.5; }
  #overlay button {
    margin-top: 10px;
    padding: 14px 36px;
    font-size: 16px;
    font-weight: bold;
    background: linear-gradient(135deg, #00ffcc, #00b8ff);
    border: none;
    border-radius: 8px;
    color: #001018;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 0 20px rgba(0,255,204,0.4);
  }
  #overlay button:active { transform: scale(0.96); }
  .statRow { display:flex; gap: 30px; font-size: 15px; margin-top: 4px; }
  .statRow span b { color:#00ffcc; }
  #tapHint {
    position: absolute;
    bottom: 30px; left: 0; width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="timeBar"></div>
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div id="levelBadge">NIVEL 1 · FÁCIL</div>
    <div id="timeDisplay">00:00 / 05:00</div>
    <div id="scoreDisplay">Distancia: 0m</div>
  </div>
  <div id="tapHint">TOCA LA PANTALLA O PULSA ESPACIO PARA SALTAR</div>

  <div id="overlay">
    <h1>🎮 TORNEO GAMER</h1>
    <h2 style="color:#00ffcc; letter-spacing:3px;">GEOMETRY RUSH</h2>
    <p>Esquiva los obstáculos y sobrevive 5 minutos. La dificultad sube en 3 niveles: Fácil → Medio → Infierno. ¡Casi nadie llega al final!</p>
    <button id="startBtn">EMPEZAR</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const levelBadge = document.getElementById('levelBadge');
  const timeDisplay = document.getElementById('timeDisplay');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const timeBar = document.getElementById('timeBar');
  const tapHint = document.getElementById('tapHint');

  let W, H, GROUND_Y;
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    GROUND_Y = H * 0.78;
  }
  window.addEventListener('resize', resize);
  resize();

  const TOTAL_TIME = 300; // 5 minutos
  const LEVELS = [
    { name:'NIVEL 1 · FÁCIL',   until:90,  speed:200, spawnEvery:2.0,  color:'#00ffcc', bg:'#0a0a12' },
    { name:'NIVEL 2 · MEDIO',   until:150, speed:350, spawnEvery:1.5,  color:'#ffcc00', bg:'#12100a' },
    { name:'NIVEL 3 · INFIERNO',until:300, speed:600, spawnEvery:0.8,  color:'#ff2e6c', bg:'#1a0508' },
  ];

  let state = 'menu'; // menu | playing | gameover | victory
  let elapsed = 0;
  let lastTime = 0;
  let spawnTimer = 0;
  let distance = 0;
  let obstacles = [];
  let particles = [];
  let currentLevelIdx = 0;

  const player = {
    x: 0, y: 0, size: 42,
    vy: 0, rotation: 0,
    grounded: true,
    gravity: 2400,
    jumpForce: -820,
  };

  function resetGame(){
    elapsed = 0;
    spawnTimer = 0;
    distance = 0;
    obstacles = [];
    particles = [];
    currentLevelIdx = 0;
    player.x = W * 0.18;
    player.y = GROUND_Y - player.size;
    player.vy = 0;
    player.rotation = 0;
    player.grounded = true;
  }

  function getLevel(t){
    for (let i=0;i<LEVELS.length;i++){
      if (t < LEVELS[i].until) return {lvl: LEVELS[i], idx:i};
    }
    return {lvl: LEVELS[LEVELS.length-1], idx: LEVELS.length-1};
  }

  function jump(){
    if (state !== 'playing') return;
    if (player.grounded){
      player.vy = player.jumpForce;
      player.grounded = false;
    }
  }

  window.addEventListener('keydown', (e)=>{
    if (e.code === 'Space'){ e.preventDefault(); jump(); }
  });
  canvas.addEventListener('pointerdown', (e)=>{ e.preventDefault(); jump(); });
  document.getElementById('gameContainer').addEventListener('pointerdown', jump);

  startBtn.addEventListener('click', ()=>{
    resetGame();
    state = 'playing';
    overlay.classList.add('hidden');
    tapHint.style.opacity = '1';
    lastTime = performance.now();
    requestAnimationFrame(loop);
  });

  function spawnObstacle(levelIdx){
    const groundSize = 34 + Math.random()*22;
    // patrón especial en nivel infierno: ráfagas de 3
    if (levelIdx === 2 && Math.random() < 0.4){
      const gap = 130;
      for (let i=0;i<3;i++){
        obstacles.push({
          x: W + i*gap, y: GROUND_Y, size: groundSize, type:'spike'
        });
      }
      return;
    }
    // dobles obstáculos en nivel medio
    if (levelIdx === 1 && Math.random() < 0.35){
      obstacles.push({ x: W, y: GROUND_Y, size: groundSize, type:'spike' });
      obstacles.push({ x: W + 90, y: GROUND_Y, size: groundSize, type:'spike' });
      return;
    }
    obstacles.push({ x: W, y: GROUND_Y, size: groundSize, type:'spike' });
  }

  function rectFromSpike(o){
    return { x: o.x, y: o.y - o.size, w: o.size, h: o.size };
  }

  function checkCollision(){
    const pSize = player.size * 0.72; // hitbox algo más generosa que el sprite
    const px = player.x + (player.size - pSize)/2;
    const py = player.y + (player.size - pSize)/2;
    for (const o of obstacles){
      const r = rectFromSpike(o);
      if (px < r.x + r.w*0.85 && px + pSize > r.x + r.w*0.15 &&
          py < r.y + r.h && py + pSize > r.y + r.h*0.15){
        return true;
      }
    }
    return false;
  }

  function spawnCrashParticles(x,y,color){
    for (let i=0;i<26;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = 100 + Math.random()*300;
      particles.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        life: 0.6 + Math.random()*0.4,
        color
      });
    }
  }

  function endGame(win){
    state = win ? 'victory' : 'gameover';
    tapHint.style.opacity = '0';
    const mins = Math.floor(elapsed/60);
    const secs = Math.floor(elapsed%60);
    const timeStr = String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
    overlay.innerHTML = `
      <h1>${win ? '🏆 ¡VICTORIA!' : '💥 GAME OVER'}</h1>
      <p>${win ? 'Llegaste a la meta de 5 minutos. ¡Eres de los pocos que sobrevive al Infierno!' : 'Chocaste contra un obstáculo. ¡Intenta llegar más lejos!'}</p>
      <div class="statRow">
        <span>Tiempo: <b>${timeStr}</b></span>
        <span>Distancia: <b>${Math.floor(distance)}m</b></span>
      </div>
      <button id="retryBtn">JUGAR DE NUEVO</button>
    `;
    overlay.classList.remove('hidden');
    document.getElementById('retryBtn').addEventListener('click', ()=>{
      resetGame();
      state = 'playing';
      overlay.classList.add('hidden');
      tapHint.style.opacity = '1';
      lastTime = performance.now();
      requestAnimationFrame(loop);
    });
  }

  function update(dt){
    elapsed += dt;
    if (elapsed >= TOTAL_TIME){
      elapsed = TOTAL_TIME;
      endGame(true);
      return;
    }

    const { lvl, idx } = getLevel(elapsed);
    currentLevelIdx = idx;

    // física del jugador
    player.vy += player.gravity * dt;
    player.y += player.vy * dt;
    if (player.y + player.size >= GROUND_Y){
      player.y = GROUND_Y - player.size;
      player.vy = 0;
      player.grounded = true;
    }
    if (player.grounded){
      player.rotation = Math.round(player.rotation/90)*90;
    } else {
      player.rotation += dt * 480;
    }

    // spawn obstáculos
    spawnTimer += dt;
    if (spawnTimer >= lvl.spawnEvery){
      spawnTimer = 0;
      spawnObstacle(idx);
    }

    // mover obstáculos
    for (const o of obstacles){ o.x -= lvl.speed * dt; }
    obstacles = obstacles.filter(o => o.x > -o.size - 20);

    distance += lvl.speed * dt * 0.05;

    // partículas
    for (const p of particles){
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vy += 900*dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);

    if (checkCollision()){
      spawnCrashParticles(player.x+player.size/2, player.y+player.size/2, lvl.color);
      endGame(false);
      return;
    }

    // HUD
    levelBadge.textContent = lvl.name;
    levelBadge.style.background = lvl.color;
    levelBadge.style.color = '#001018';
    const mins = Math.floor(elapsed/60);
    const secs = Math.floor(elapsed%60);
    timeDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')} / 05:00`;
    scoreDisplay.textContent = `Distancia: ${Math.floor(distance)}m`;
    timeBar.style.width = (elapsed/TOTAL_TIME*100)+'%';
  }

  function drawBackground(lvl){
    ctx.fillStyle = lvl.bg;
    ctx.fillRect(0,0,W,H);

    // grid decorativo sutil
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    const gridOffset = (elapsed * lvl.speed) % 60;
    for (let x = -gridOffset; x < W; x += 60){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }

    // suelo
    ctx.fillStyle = lvl.color;
    ctx.globalAlpha = 0.9;
    ctx.fillRect(0, GROUND_Y, W, 4);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, GROUND_Y+4, W, H-GROUND_Y-4);
  }

  function drawPlayer(lvl){
    ctx.save();
    ctx.translate(player.x + player.size/2, player.y + player.size/2);
    ctx.rotate(player.rotation * Math.PI/180);
    ctx.shadowColor = lvl.color;
    ctx.shadowBlur = 18;
    ctx.fillStyle = lvl.color;
    ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 3;
    ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);
    ctx.restore();
  }

  function drawObstacles(lvl){
    for (const o of obstacles){
      ctx.save();
      ctx.fillStyle = '#ff2e44';
      ctx.shadowColor = '#ff2e44';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(o.x, o.y);
      ctx.lineTo(o.x + o.size/2, o.y - o.size);
      ctx.lineTo(o.x + o.size, o.y);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function drawParticles(){
    for (const p of particles){
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-3, p.y-3, 6, 6);
    }
    ctx.globalAlpha = 1;
  }

  function draw(){
    const { lvl } = getLevel(elapsed);
    drawBackground(lvl);
    drawObstacles(lvl);
    drawPlayer(lvl);
    drawParticles();
  }

  function loop(now){
    if (state !== 'playing') return;
    const dt = Math.min((now - lastTime)/1000, 0.033);
    lastTime = now;
    update(dt);
    if (state === 'playing') draw();
    if (state === 'playing') requestAnimationFrame(loop);
    else draw();
  }

})();
</script>
</body>
</html>
